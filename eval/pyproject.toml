[project]
name = "etsi-eval"
version = "0.1.0"
description = "LLM-as-judge evaluation harness for the etsi-rag agent"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etsi_eval"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
