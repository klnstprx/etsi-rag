version = 1

; llama-server router preset for the `llama` compose service. Section names are
; the model IDs the server exposes; deploy/config.docker.toml refers to them.
; Paths are inside the container: ./models is mounted at /models.
; All three models stay fully on the GPU (about 21.2 GiB on one 24 GB card).
; Without the c/parallel limits llama-server sizes each KV cache for the
; model's full training context times four slots, and the agent no longer fits.

[gemma4-12b]
model = /models/gemma-4-12b-it-UD-Q8_K_XL.gguf
mmproj = /models/gemma-4-12b-it-mmproj-F32.gguf
c = 32768
parallel = 1
temp = 1.0
top-p = 0.95
top-k = 64
jinja = true
flash-attn = on
reasoning = off
n-gpu-layers = all
fit = off

[octen-embedding-4b]
model = /models/Octen-Embedding-4B.Q8_0.gguf
embedding = true
c = 8192
parallel = 1
jinja = true
n-gpu-layers = all
fit = off

; The reranker scores each query-passage pair in one physical batch, so b/ub
; must cover its context (the default 512 fails longer pairs with HTTP 500).
[bge-reranker-v2-m3]
model = /models/bge-reranker-v2-m3-Q8_0.gguf
reranking = true
c = 8192
parallel = 1
b = 8192
ub = 8192
jinja = true
n-gpu-layers = all
fit = off
