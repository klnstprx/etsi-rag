[server]
host = '127.0.0.1'
port = 3000
read_timeout = 15
write_timeout = 120

[[backends]]
name = 'local-llama'
base_url = 'http://localhost:1337/v1'
api_key = ''
enabled = true
is_llama_cpp = true

[embedding]
backend = 'local-llama'
model = 'Qwen3-Embedding-8B-Q8_0.gguf'
dimension = 4096
max_tokens = 512

[chat]
backend = 'local-llama'
model = 'Qwen3-Embedding-8B-Q8_0.gguf'
max_tokens = 1024
temperature = 0.7

[agent]
backend = 'local-llama'
model = 'Qwen3-Embedding-8B-Q8_0.gguf'
max_tokens = 1024
temperature = 0.7

[database]
path = 'data/etsi-rag.db'

[rag]
top_k = 5
similarity_threshold = 0.7
max_context_tokens = 2048
system_prompt_es = "Eres un asistente virtual de la Escuela Técnica Superior de Ingeniería Informática de la Universidad de Málaga.\nTu objetivo es ayudar a estudiantes y visitantes con información sobre los grados, cursos, procedimientos y servicios de la escuela.\nResponde siempre en español, de manera clara y concisa.\nSi no tienes información suficiente para responder, indícalo amablemente.\nBasa tus respuestas en el contexto proporcionado cuando esté disponible."
system_prompt_en = "You are a virtual assistant for the School of Computer Science Engineering at the University of Malaga.\nYour goal is to help students and visitors with information about degrees, courses, procedures, and services at the school.\nAlways respond in English, in a clear and concise manner.\nIf you don't have enough information to answer, politely indicate so.\nBase your responses on the provided context when available."

[chunking]
max_chunk_size = 256
chunk_overlap = 32
separators = ["\n\n", "\n", '. ', ' ', '']

[session]
max_messages = 10
ttl_seconds = 3600

[crawler]
request_delay = 500000000
request_timeout = 30000000000
max_depth = 10
max_pages = 5000
concurrency = 4
max_body_size = 10485760
embed_workers = 1
parse_workers = 4
max_embed_fails = 3
js_patterns = ['/centers/subject/']

[object_store]
endpoint = 'http://localhost:9000'
bucket = 'etsi-rag'
access_key = 'minioadmin'
secret_key = 'minioadmin'
region = 'us-east-1'
