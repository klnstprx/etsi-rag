# ============================================================
# Infrastructure
# ============================================================

[server]
host = '127.0.0.1'
port = 3000
read_timeout = 15                # seconds
write_timeout = 300               # seconds; outer http.Server write deadline, must outlast request_timeout
request_timeout = 120            # seconds; per-request handler ceiling, bounds the agent tool-calling loop
idle_timeout = '60s'             # keep-alive idle
shutdown_timeout = '30s'         # graceful shutdown grace

[admin]
backend_probe_timeout = '3s'     # per-request timeout for backend health checks
backend_models_timeout = '5s'    # per-request timeout for /models listing
chat_stream_timeout = '5m'       # max lifetime of a chat-stream goroutine (orphaned-goroutine safety net)

[database]
path = 'data/etsi-rag.db'

[object_store]
endpoint = 'http://localhost:9000'
bucket = 'etsi-rag'
access_key = 'minioadmin'
secret_key = 'minioadmin'
region = 'us-east-1'

[[backends]]
name = 'local-llama'
base_url = 'http://localhost:1337/v1'
api_key = ''
enabled = true
is_llama_cpp = true
max_retries = 10               # 5xx retry budget per call (~120s exp-backoff). 0 = use llm.DefaultMaxRetries.

# ============================================================
# Pipeline (chunk → embed → retrieve → answer)
# ============================================================

[chunking]
max_chunk_size = 256
chunk_overlap = 32
min_chunk_size = 64
separators = ["\n\n", "\n", '. ', ' ', '']
title_in_search_text = true  # embed and keyword-index each chunk with its document title ahead of the breadcrumb

[embedding]
backend = 'local-llama'
model = 'octen-embedding-4b'  # Octen-Embedding-4B Q8_0, an Apache-2.0 fine-tune of Qwen3-Embedding-4B; the evaluated embedder
dimension = 2560
max_tokens = 0   # 0 = auto-detect via /props; non-zero overrides. 512-token floor when neither is available.
batch_size = 8

[retrieval]
top_k = 10
# Tuned operating point from the context-budget A/B (ADR-007): 4092 with
# top_k=10; naive widening (8192/top_k=20) regressed answer quality.
max_context_tokens = 4092
# "dense"  — cosine similarity over query embedding.
# "hybrid" — dense + BM25 keyword search merged via reciprocal-rank fusion.
# Hybrid combined with the reranker below is the evaluated/shipped stack (ADR-008,
# ADR-009); fall back to "dense" only if no BM25 candidate pool is wanted.
retrieval_mode = 'hybrid'

# Cross-encoder reranker (opt-in). When enabled, retrieval over-fetches a
# wider candidate pool and re-scores it with a llama.cpp /rerank model before
# trimming to retrieval.top_k. Backend MUST have is_llama_cpp = true; the
# /rerank endpoint is a llama.cpp/Jina extension, not an OpenAI endpoint.
# See ADR-009.
[reranker]
enabled = true
backend = 'local-llama'
model = 'bge-reranker-v2-m3'  # BAAI 568M multilingual cross-encoder; selected after eval sweep (ADR-009)
top_n = 30                    # candidate pool size; must be >= retrieval.top_k
max_tokens = 0                # 0 = auto-detect via /props; non-zero overrides
reserved_tokens = 16          # BOS/EOS/separator budget held back from per-doc truncation
timeout = '30s'               # per-request deadline; cold-load forgiving
title_in_text = true          # rerank "document title > breadcrumb: body"; false = body only

[agent]
backend = 'local-llama'
# MUST be a chat/instruct model — never an embedding model. Gemma 4 12B at Q8
# fits a 24 GB GPU beside the embedder and reranker and beat E4B in evaluation;
# use gemma-4-E4B-it-Q8_K_XL.gguf where memory is tight, or any instruct model
# your backend serves. Reasoning models that emit hidden "thinking" tokens need
# max_tokens raised well above their reasoning budget, or they return empty text.
model = 'gemma4-12b'  # Gemma 4 12B Q8_K_XL; the evaluated and shipped agent
max_tokens = 1024
temperature = 0.7
# 0 = auto: follow the llama.cpp /props probe (the per-request n_ctx the
# server actually enforces, re-read at startup and on every config save).
# A non-zero value is an explicit operator override. Probe readings are never
# written back to this file.
context_window = 0
max_iterations = 20
tool_output_max_tokens = 0        # 0 = auto-derive from the agent token budget pool (floor 256)
history_reserve_tokens = 1280     # token headroom reserved from the context window for session history
user_reserve_tokens = 512         # token headroom reserved from the context window for the incoming user message
system_prompt = ''                # empty = use prompts/agent.md

[agent.vision]
enabled = false                   # operator asserts the configured agent.model is vision-capable
max_images_per_call = 6           # cap on image artifacts attached per tool call
max_image_bytes_per_call = 65536  # cap on image_url byte length per tool call
image_transport = 'inline'        # 'inline': send image bytes as data URIs; 'url': send public_base_url links the backend fetches
public_base_url = ''              # url transport only: absolute URL prefix for /v1/artifacts/{token}.png (llama.cpp also needs --media-allow-private-urls for a local address)

[session]
max_messages = 10
ttl_seconds = 3600

# ============================================================
# Ingest (crawler)
# ============================================================

[crawler]
request_delay = '1s'
request_timeout = '30s'
# uma.es limits file-browser downloads far below its pages (about 1.4 a minute
# from one IP, 429 from HAProxy); they get their own lane so pages keep going.
throttled_paths = ['/navegador_de_ficheros/']
throttled_path_delay = '45s'
rate_limit_retries = 4
rate_limit_backoff = '30s'
rate_limit_max_wait = '5m'
progress_log_interval = '30s'
max_depth = 10
max_pages = 5000
concurrency = 4
max_body_size = 10485760
min_content_length = 200
embed_workers = 1
parse_workers = 4
max_embed_fails = 10
js_patterns = ['/centers/subject/']
rejection_patterns = [
    'no ha sido posible cargar esta página',
    'página no encontrada',
    'error 404',
    'página en construcción',
    'sitio en construcción',
    'sin descripción disponible',
]
strip_query_params = [
    'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term',
    'fbclid', 'gclid', '_ga', 'ref', 'lang', 'set_language',
]

[crawler.pdf]
heading_patterns = [
    'DESCRIPCION', 'OBJETIVOS', 'CONTENIDOS', 'METODOLOGIA',
    'EVALUACION', 'COMPETENCIAS', 'TEMARIO', 'BIBLIOGRAFIA',
    'ACTIVIDADES FORMATIVAS', 'SISTEMA DE EVALUACION',
    'RESULTADOS DE APRENDIZAJE', 'EQUIPO DOCENTE',
    'RECOMENDACIONES', 'DISTRIBUCION DEL TRABAJO',
]
render_dpi = 120

# ============================================================
# Eval harness (consumed by eval/ only; the Go server ignores)
# ============================================================
# Required when running the eval tool. judge_backend must reference an enabled
# [[backends]] entry. Pick a different backend from [agent] to avoid
# self-preference bias.
# [eval]
# judge_backend = 'remote-claude'
# judge_model = 'claude-sonnet-4-6'
