[server]
host = '127.0.0.1'
port = 3000
read_timeout = 15
write_timeout = 120
idle_timeout = 60000000000       # 60s keep-alive idle
shutdown_timeout = 30000000000   # 30s graceful shutdown grace

[admin]
backend_probe_timeout = 3000000000    # 3s
backend_models_timeout = 5000000000   # 5s
chat_stream_timeout = 300000000000    # 5min — orphaned-goroutine safety net

[[backends]]
name = 'local-llama'
base_url = 'http://localhost:1337/v1'
api_key = ''
enabled = true
is_llama_cpp = true

[embedding]
backend = 'local-llama'
model = 'Qwen3-Embedding-8B-Q8_0.gguf'
dimension = 4096
max_tokens = 512
batch_size = 2

[agent]
backend = 'local-llama'
model = 'Qwen3-Embedding-8B-Q8_0.gguf'
max_tokens = 1024
temperature = 0.7
context_window = 0
max_iterations = 5
system_prompt = ''
tool_output_max_tokens = 0  # 0 = auto (context_window / 4, floor 256)

[database]
path = 'data/etsi-rag.db'

[rag]
top_k = 10
max_context_tokens = 2048

[api]
passthrough = false

[chunking]
max_chunk_size = 256
chunk_overlap = 32
separators = ["\n\n", "\n", '. ', ' ', '']

[session]
max_messages = 10
ttl_seconds = 3600

[crawler]
request_delay = 500000000
request_timeout = 30000000000
progress_log_interval = 30000000000  # 30s — how often to log crawl progress
max_depth = 10
max_pages = 5000
concurrency = 4
max_body_size = 10485760
min_content_length = 200
embed_workers = 1
parse_workers = 4
max_embed_fails = 3
js_patterns = ['/centers/subject/']
rejection_patterns = [
    'página no encontrada',
    'error 404',
    'página en construcción',
    'sitio en construcción',
    'sin descripción disponible',
]
strip_query_params = [
    'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term',
    'fbclid', 'gclid', '_ga', 'ref', 'lang',
]

[crawler.pdf]
heading_patterns = [
    'DESCRIPCION', 'OBJETIVOS', 'CONTENIDOS', 'METODOLOGIA',
    'EVALUACION', 'COMPETENCIAS', 'TEMARIO', 'BIBLIOGRAFIA',
    'ACTIVIDADES FORMATIVAS', 'SISTEMA DE EVALUACION',
    'RESULTADOS DE APRENDIZAJE', 'EQUIPO DOCENTE',
    'RECOMENDACIONES', 'DISTRIBUCION DEL TRABAJO',
]

[object_store]
endpoint = 'http://localhost:9000'
bucket = 'etsi-rag'
access_key = 'minioadmin'
secret_key = 'minioadmin'
region = 'us-east-1'
