# Crawl sources for the ETSI Informática RAG.
#
# Each [[sources]] block defines one BFS seed. Keys are stable slugs used as
# foreign keys in crawl_pages/crawl_runs, so a source can be renamed or its
# seed URL changed without orphaning history.
#
# Edit this file directly or use the admin UI at /admin/crawler — the admin
# CRUD endpoints write back to sources.toml and hot-reload the running crawler.
#
# `description` and `tags` are agent-facing scoping hints surfaced through the
# list_sources tool. The agent can pass selected source_keys to semantic_search
# to narrow retrieval to a topical subset of the corpus. Tag vocabulary is
# documented in docs/configuration.md (extensible — operators may invent tags,
# but should prefer the existing set for cross-source consistency).

